[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[project]
name = "differentiable-reactor-lab"
version = "0.1.0"
description = "A reduced-order particle reactor simulator built with JAX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "equinox>=0.11",
    "jax>=0.4.30",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "optax>=0.2",
]

[project.scripts]
reactor-lab = "reactor_lab.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
